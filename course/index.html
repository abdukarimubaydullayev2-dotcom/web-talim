function showHome(){select('home');document.querySelector('#crumb').textContent='O‘quv platformasi / Bosh sahifa';document.querySelector('#content').innerHTML=`<section class="hero"><figure class="institution-photo"><img src="assets/texnikum-building-2026.jpg" alt="Namangan shahar 3-sonli texnikum binosi"><figcaption>Namangan shahar 3-sonli texnikum</figcaption></figure><div class="eyebrow">BILIMDAN — AMALIYOTGA</div><h1>Web dasturlashni<br>birgalikda o‘rganamiz.</h1><p>Kasbiy faoliyat, xavfsiz mehnat va dasturlash ko‘nikmalarini bosqichma-bosqich o‘rganing.</p><button class="cta" onclick="showLesson(1)">1-modulni boshlash →</button><p class="muted">O‘qituvchi: <b>Ubaydullayev Abdukarim</b></p></section><section class="school-intro" aria-labelledby="school-directions-title"><div class="eyebrow">NAMANGAN SHAHAR 3-SONLI TEXNIKUM</div><h2 id="school-directions-title">Kasb sari birinchi qadam</h2><p>Texnikumdagi ta’lim yo‘nalishlari bilan tanishing. Quyidagi yo‘nalishlar va ta’lim shakllari siz yuborgan 2026/2027-o‘quv yili e’lonida ko‘rsatilgan ma’lumotlar asosida berildi.</p><figure class="school-announcement"><a href="assets/texnikum-directions-2026.jpg" target="_blank" rel="noopener" aria-label="Texnikum yo‘nalishlari haqidagi e’lonni to‘liq ochish"><img src="assets/texnikum-directions-2026.jpg" width="1195" height="896" loading="lazy" alt="Namangan shahar 3-sonli texnikumning 2026/2027-o‘quv yili uchun beshta ta’lim yo‘nalishi haqidagi e’loni"></a><figcaption>2026/2027-o‘quv yili e’loni · <a href="assets/texnikum-directions-2026.jpg" target="_blank" rel="noopener">Rasmni to‘liq ko‘rish ↗</a></figcaption></figure><div class="direction-grid"><article class="direction-card"><span class="direction-tag">01 / LOGISTIKA</span><h3>Yuk va mahsulotlar harakatini rejalashtirish</h3><p>Logistika yuk tashish, ombor, yetkazib berish va ta’minot jarayonlarining o‘zaro bog‘liqligini o‘rganadi. Asosiy e’tibor — mahsulotni kerakli joyga, kerakli vaqtda yetkazish.</p></article><article class="direction-card"><span class="direction-tag">02 / ARXITEKTURA VA DIZAYN</span><h3>G‘oyadan loyiha va makon yechimigacha</h3><p>Binolar va makonlarning tuzilishi, chizmalar, shakl, rang va kompozitsiya haqida tasavvur hosil qiladi. Qulaylik va estetikani birlashtiruvchi loyiha yechimlari ushbu sohaning asosidir.</p></article><article class="direction-card"><span class="direction-tag">03 / AVTOMOBILLAR TRANSPORTI SERVISI</span><h3>Avtomobilga texnik xizmat ko‘rsatish</h3><p>Avtomobil qismlari, ularning ishlashi, texnik holatni tekshirish va nosozliklarni aniqlash bilan bog‘liq yo‘nalish. Texnik xizmat va xavfsiz ishlash ko‘nikmalariga e’tibor qaratiladi.</p></article><article class="direction-card"><span class="direction-tag">04 / TURIZM</span><h3>Sayohatni tashkil etish va mehmonlarga xizmat</h3><p>Sayohat yo‘nalishlari, turistik xizmatlar, mehmonlar bilan muloqot va madaniy merosni tanishtirish ushbu sohaning asosiy mavzularidir.</p></article><article class="direction-card"><span class="direction-tag">05 / BUXGALTERIYA HISOBI VA AUDIT</span><h3>Moliyaviy hisob va hujjatlarni tahlil qilish</h3><p>Daromad va xarajatlarni qayd etish, hisob hujjatlari, moliyaviy hisobot hamda ularni tekshirish asoslariga oid yo‘nalish. Aniqlik, tartib va hisob-kitob ko‘nikmalari muhim o‘rin tutadi.</p></article></div><p class="school-study-note"><b>E’londagi ta’lim shakllari:</b> dastlabki to‘rtta yo‘nalish — 11-sinfdan keyin, davlat granti asosidagi kunduzgi ta’lim. Buxgalteriya hisobi va audit — dual ta’lim, to‘lov-kontrakt asosida.</p></section><h2>1-modul</h2><h2>${moduleName}</h2><p class="muted">40 soat · 20 para · 13 nazariy va 7 amaliy mashg‘ulot · 4 qism</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${groups.map((g,i)=>`<section class="card"><div class="num">0${i+1} / QISM</div><h3>${g.name}</h3><p class="muted">${g.topics.length} ta mavzu · ${g.topics.length*2} soat</p><button onclick="showPart(${i})">Mavzularni ko‘rish →</button></section>`).join('')}</div><div class="notice">Mavzular yuborilgan nazariy va amaliy materiallar asosida tartiblandi. Barcha 20 ta mashg‘ulot uchun konspekt yoki amaliy yo‘riqnoma, prezentatsiya, javobli savollar va testlar mavjud. 13 ta nazariy va 7 ta amaliy mashg‘ulot, jami 40 soat.</div><div class="footer">Web Ta’lim · Namangan shahar 3-sonli texnikum · 2026/2027</div>`}

function playLessonVideo(index){const video=activeData().videos?.[index];if(!video||!(video.playlist?/^PL[-_a-zA-Z0-9]+$/.test(video.playlist):/^[-_a-zA-Z0-9]{11}$/.test(video.id)))return;stopLessonVideos(index);const holder=document.getElementById('video-player-'+index);const frame=document.createElement('iframe');frame.src=video.playlist?'https://www.youtube-nocookie.com/embed?listType=playlist&list='+video.playlist+'&autoplay=1&rel=0&playsinline=1':'https://www.youtube-nocookie.com/embed/'+video.id+'?autoplay=1&rel=0&playsinline=1';frame.title=video.title;frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.setAttribute('allowfullscreen','');frame.referrerPolicy='strict-origin-when-cross-origin';holder.replaceChildren(frame);}
