name: Import verified learning materials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/site-assets.json
      - .github/import_site.py
      - .github/workflows/import-site.yml
permissions:
  contents: write
concurrency:
  group: import-learning-snapshot
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and verify existing public site files
        run: python3 .github/import_site.py
      - name: Commit the learning platform snapshot
        run: |
          git add dist
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="Web Talim Import" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import verified platform assets and learning materials"
          git push origin HEAD:main
