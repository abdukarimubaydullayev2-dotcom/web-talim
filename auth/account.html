<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hisobim — Web Ta’lim</title><link rel="stylesheet" href="/auth/style.css"></head><body><main class="account-card"><p class="eyebrow">WEB TA’LIM / HISOBIM</p><h1>Shaxsiy ma’lumotlar</h1><p class="hint">Ochilgan mavzular va test natijalari ta’lim jarayonini kuzatish uchun admin hisobotida saqlanadi.</p><a class="secondary" id="admin-link" href="/admin" hidden>Admin panel →</a><a class="secondary" id="teacher-link" href="/teacher" hidden>Guruhlarim →</a><a class="secondary" id="resources-link" href="/teacher/resources" hidden>Mening resurslarim →</a><a class="secondary" id="controls-link" href="/controls" hidden>Oraliq nazoratlar →</a><dl id="account-info"></dl><div class="actions"><a class="primary" href="/">Darslarga qaytish →</a><button type="button" class="secondary" id="account-exit">Hisobdan chiqish</button></div><details style="margin-top:24px;border-top:1px solid #dce5dc;padding-top:20px"><summary style="cursor:pointer;font-weight:bold">Parolni o‘zgartirish</summary><form id="password-form" style="display:grid;gap:12px;margin-top:18px"><label>Amaldagi parol<input id="password-current" type="password" autocomplete="current-password" maxlength="128" required></label><label>Yangi parol<input id="password-new" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>Yangi parolni takrorlang<input id="password-repeat" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button id="password-save" class="primary" type="submit">Parolni yangilash</button></form></details><p id="auth-status" class="status" role="status" tabindex="-1"></p></main><script src="/auth/client.js" defer></script></body></html>
